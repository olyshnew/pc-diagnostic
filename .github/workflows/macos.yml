name: macOS CI

on: [push]

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26'

      - name: Build
        run: go build -o pc-diagnostic-macos .
        
      - name: Run diagnostics
        run: printf "C\n1\n1\nQ\nQ\nQ\nQ\nQ\nQ\n" | ./pc-diagnostic-macos


