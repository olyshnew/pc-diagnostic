name: macOS CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: '1.26'

      - name: Build
        run: go build -o pc-diagnostic-macos .

      - name: Run diagnostics
        run: echo "C" | ./pc-diagnostic-macos
